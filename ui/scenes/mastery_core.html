<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #core-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="core-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('core-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const light1 = new THREE.PointLight(0xFF7A1A, 3, 20);
        light1.position.set(2, 2, 2);
        scene.add(light1);
        const light2 = new THREE.PointLight(0x22D3EE, 3, 20);
        light2.position.set(-2, -2, -2);
        scene.add(light2);

        const outerGeo = new THREE.IcosahedronGeometry(1.4, 1);
        const outerMat = new THREE.MeshBasicMaterial({ color: 0x22D3EE, wireframe: true, transparent: true, opacity: 0.6 });
        const outerCore = new THREE.Mesh(outerGeo, outerMat);
        scene.add(outerCore);

        const innerGeo = new THREE.OctahedronGeometry(0.7, 0);
        const innerMat = new THREE.MeshStandardMaterial({ color: 0xFF7A1A, roughness: 0.2, metalness: 0.9 });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerCore);

        function animate() {
            requestAnimationFrame(animate);
            outerCore.rotation.x += 0.004;
            outerCore.rotation.y += 0.007;
            innerCore.rotation.x -= 0.008;
            innerCore.rotation.y -= 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>

</html>
