<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            touch-action: none;
        }
        #canvas-container.dragging { cursor: grabbing; }
        #controls { position:absolute; left:8px; bottom:7px; z-index:2; padding:4px 7px; border:1px solid rgba(61,116,141,.55); border-radius:7px; background:rgba(7,18,29,.72); color:#c3d7e2; font:10px/1.2 "Segoe UI",sans-serif; pointer-events:none; }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="controls">Drag to rotate · scroll to zoom</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const pointLight = new THREE.PointLight(0xFF7A1A, 3, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16);
        const material = new THREE.MeshStandardMaterial({ color: 0x22D3EE, wireframe: true, roughness: 0.2, metalness: 0.8 });
        const gear = new THREE.Mesh(geometry, material);
        scene.add(gear);

        const particlesCount = 200;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 15; }
        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0xFF7A1A, transparent: true, opacity: 0.7 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        let dragging = false, lastX = 0, lastY = 0;
        container.addEventListener('pointerdown', (event) => {
            dragging = true; lastX = event.clientX; lastY = event.clientY;
            container.classList.add('dragging'); container.setPointerCapture(event.pointerId);
        });
        container.addEventListener('pointermove', (event) => {
            if (!dragging) return;
            gear.rotation.y += (event.clientX - lastX) * 0.009;
            gear.rotation.x += (event.clientY - lastY) * 0.009;
            lastX = event.clientX; lastY = event.clientY;
        });
        function stopDrag() { dragging = false; container.classList.remove('dragging'); }
        container.addEventListener('pointerup', stopDrag);
        container.addEventListener('pointercancel', stopDrag);
        container.addEventListener('wheel', (event) => {
            event.preventDefault();
            camera.position.z = Math.max(4.2, Math.min(12, camera.position.z + event.deltaY * 0.008));
        }, { passive: false });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!dragging) { gear.rotation.x += 0.0012; gear.rotation.y += 0.0018; }
            particlesMesh.rotation.y -= 0.001;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
