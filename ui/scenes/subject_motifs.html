<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #motif-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="motif-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('motif-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const light = new THREE.PointLight(0x22D3EE, 2, 20);
        light.position.set(3, 3, 3);
        scene.add(light);

        const geometry = new THREE.IcosahedronGeometry(1.2, 1);
        const material = new THREE.MeshStandardMaterial({ color: 0xFF7A1A, wireframe: true, emissive: 0x22D3EE, emissiveIntensity: 0.2 });
        const motifMesh = new THREE.Mesh(geometry, material);
        scene.add(motifMesh);

        function animate() {
            requestAnimationFrame(animate);
            motifMesh.rotation.x += 0.005;
            motifMesh.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
