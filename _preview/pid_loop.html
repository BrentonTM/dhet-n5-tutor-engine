<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0A0D12;color:#E6EDF3;font:13px/1.4 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:180px;cursor:grab;overflow:hidden}
#stage.drag{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#title{position:absolute;left:12px;top:10px;font-weight:700;color:#22D3EE;letter-spacing:.3px;pointer-events:none;text-shadow:0 1px 6px #000;font-size:14px}
#title small{display:block;color:#8B949E;font-weight:400;margin-top:2px;max-width:56vw;font-size:11px}
#btns{position:absolute;right:10px;top:8px;display:flex;gap:6px}
#btns button{background:rgba(22,27,34,.88);color:#E6EDF3;border:1px solid #30363D;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
#btns button:hover{border-color:#22D3EE}
#btns button.on{border-color:#FF7A1A;color:#FF7A1A}
#hint{position:absolute;left:10px;right:10px;bottom:8px;pointer-events:none;background:rgba(10,13,18,.86);border:1px solid #30363D;border-left:3px solid #FF7A1A;border-radius:8px;padding:6px 10px;min-height:32px;font-size:12px}
#hint b{color:#FF7A1A}
#panel{flex:0 0 auto;max-height:44%;overflow:auto;background:#0d1117;border-top:1px solid #30363D;padding:8px 12px;display:none;gap:10px 26px;flex-wrap:wrap;align-items:flex-start}
#ctrls{display:flex;flex-wrap:wrap;gap:6px 22px;flex:2 1 320px}
#reads{display:flex;flex-direction:column;gap:3px;flex:1 1 230px}
.row{display:flex;flex-direction:column;min-width:190px;font-size:12px;color:#c9d1d9}
.row input[type=range]{width:100%;accent-color:#FF7A1A}
.row input[type=checkbox]{accent-color:#FF7A1A;width:18px;height:18px}
.read{display:flex;justify-content:space-between;gap:12px;font-size:12px;border-bottom:1px dashed #21262d;padding:1px 0}
.read span{color:#8B949E}.read b{color:#22D3EE;font-family:"JetBrains Mono",Consolas,monospace;font-weight:600;text-align:right}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';document.head.appendChild(s);"></script></head>

<div id="panel"><div id="ctrls"></div><div id="reads"></div></div>
<script>

 "value": 2, "step": 0.1}, {"id": "Ti", "label": "Integral time Ti", "min": 2, "max": 20, "value": 10, "step": 1, "unit": "s"}, {"id": "Td", "label": "Derivative time Td", "min": 0, "max": 5, "value": 0.5, "step": 0.1, "unit": "s"}], "readouts": [{"label": "P term", "expr": "(p.Kp*p.e).toFixed(1)+' %'"}, {"label": "I term (after 5 s)", "expr": "(p.Kp*p.e*5/p.Ti).toFixed(1)+' %'"}, {"label": "D term", "expr": "(p.Kp*p.Td*p.de).toFixed(1)+' %'"}, {"label": "Controller output (50 % bias)", "expr": "clamp(50+p.Kp*p.e+p.Kp*p.e*5/p.Ti+p.Kp*p.Td*p.de,0,100).toFixed(1)+' %'"}, {"label": "Loop type", "expr": "p.fb>0.5?'Closed loop (self-correcting)':'Open loop (no correction!)'"}], "camera": {"pos": [-1, 3, 15], "target": [-1, 0.4, 0]}, "auto": false, "gridY": -3.2, "grid": true};

      f=compile(o.f);var aa=val(o.x),h=1e-4,mslope=(f(P,T,aa+h)-f(P,T,aa-h))/(2*h),ya=f(P,T,aa),Ll=o.len||2,xa=aa-Ll,xb=aa+Ll;
      node=polyTube([[o.p[0]+(xa-o.x0)*o.sx,o.p[1]+(ya+mslope*(xa-aa))*o.sy,o.p[2]||0],[o.p[0]+(xb-o.x0)*o.sx,o.p[1]+(ya+mslope*(xb-aa))*o.sy,o.p[2]||0]],o.r||0.03,o,false);break;}
    case 'arc':{
      var a0=val(o.a0)*D2R,a1=val(o.a1)*D2R;pts=[];n=o.n||48;
      for(i=0;i<=n;i++){var ang=a0+(a1-a0)*i/n;pts.push([o.c[0]+o.R*Math.cos(ang),o.c[1]+o.R*Math.sin(ang),o.c[2]||0]);}
      node=polyTube(pts,o.r||0.1,o,false);break;}
    default:node=null;
  }
  return node;
}

var entries=[];
function finish(en){
  var o=en.o,node=en.node;if(!node)return;
  if(o.type==='text')labelGroup.add(node);else world.add(node);
  node.userData.entry=en;
  if(POS[o.type]&&o.p)node.position.set(o.p[0],o.p[1],o.p[2]||0);
  if(o.rot)node.rotation.set(o.rot[0]*D2R,o.rot[1]*D2R,o.rot[2]*D2R);
  if(o.scale)node.scale.set(o.scale[0],o.scale[1],o.scale[2]);
  en._em=null;en._col=null;
}
function disposeNode(node){
  if(node.parent)node.parent.remove(node);
  node.traverse(function(c){if(c.geometry)c.geometry.dispose();if(c.material&&c.material.dispose)c.material.dispose();});
}
function addEntry(o){
  var en={o:o,node:null,label:null,hover:false,dyn:!!DYN[o.type]};
  en.node=build(o);finish(en);
  if(o.label&&o.type!=='text'){en.label=makeLabel(o.label,o.lcolor||'#E6EDF3',o.lsize||0.36);labelGroup.add(en.label);}
  entries.push(en);
}
(S.objects||[]).forEach(addEntry);

/* ---------- state change ---------- */
var uiRefs={};
function fmtV(q,v){
  if(q.names)return q.names[Math.round(v)]||String(v);
  if(q.toggle)return v?'ON':'OFF';
  var s=(Math.abs(v)>=100)?v.toFixed(0):(Math.abs(v)>=10?v.toFixed(1):(Math.round(v*100)/100).toString());
  return s+(q.unit?' '+q.unit:'');
}
function refreshUI(syncInputs){
  (S.params||[]).forEach(function(q){
    var r=uiRefs[q.id];if(!r)return;
    r.span.textContent=q.label+': '+fmtV(q,P[q.id]);
    if(syncInputs){if(q.toggle)r.inp.checked=!!P[q.id];else r.inp.value=P[q.id];}
  });
  (S.readouts||[]).forEach(function(rd,i){var el=document.getElementById('rd'+i);if(el){var v=compile(rd.expr)(P,T);el.textContent=(typeof v==='number')?(Math.round(v*1000)/1000).toString():String(v);}});
}
function changed(fromUI){
  entries.forEach(function(en){
    if(en.dyn){var old=en.node;en.node=build(en.o);if(old)disposeNode(old);finish(en);}
  });
  refreshUI(!fromUI);
}
function buildUI(){
  var ctrls=document.getElementById('ctrls'),reads=document.getElementById('reads'),any=false;
  (S.params||[]).forEach(function(q){
    if(q.hidden)return;any=true;
    var row=document.createElement('label');row.className='row';
    var span=document.createElement('span');var inp=document.createElement('input');
    if(q.toggle){inp.type='checkbox';inp.checked=!!q.value;inp.oninput=function(){P[q.id]=inp.checked?1:0;changed(true);};}
    else{inp.type='range';inp.min=q.min;inp.max=q.max;inp.step=q.step||((q.max-q.min)/100);inp.value=q.value;inp.oninput=function(){P[q.id]=parseFloat(inp.value);changed(true);};}
    row.appendChild(span);row.appendChild(inp);ctrls.appendChild(row);uiRefs[q.id]={inp:inp,span:span};
  });
  (S.readouts||[]).forEach(function(rd,i){any=true;var d=document.createElement('div');d.className='read';d.innerHTML='<span>'+esc(rd.label)+'</span><b id="rd'+i+'"></b>';reads.appendChild(d);});
  if(any)document.getElementById('panel').style.display='flex';
  refreshUI(false);
}
buildUI();

document.getElementById('title').innerHTML=esc(S.title||'')+(S.subtitle?'<small>'+esc(S.subtitle)+'</small>':'');
var hint=document.getElementById('hint');
var defHint=S.hint||'Drag to rotate · scroll to zoom · right-drag to pan · hover a part to see what it does';
hint.innerHTML=esc(defHint);
function showHint(en){
  if(!en||(!en.o.info&&!en.o.label)){hint.innerHTML=esc(defHint);return;}
  hint.innerHTML='<b>'+esc(en.o.label||en.o.name||'')+'</b> '+esc(en.o.info||'')+(en.o.click?' <i style="color:#22D3EE">(click to change)</i>':'');
}

/* ---------- per-frame binding ---------- */
function setEm(node,v){node.traverse(function(c){if(c.material&&c.material.emissive&&c.material.emissiveIntensity!==undefined)c.material.emissiveIntensity=v;});}
function setCol(node,v){var col=new THREE.Color(v);node.traverse(function(c){if(c.material&&c.material.color){c.material.color.copy(col);if(c.material.emissive)c.material.emissive.copy(col);}});}
function setOp(node,v){node.traverse(function(c){if(c.material&&c.material.transparent!==undefined){c.material.transparent=v<0.99;c.material.opacity=v;c.material.depthWrite=v>=0.95;}});}
function applyBinds(){
  for(var e=0;e<entries.length;e++){
    var en=entries[e],o=en.o,node=en.node;if(!node)continue;
    var b=o.bind,em=o.emissive||0;
    if(b){
      for(var k in b){
        var v=compile(b[k])(P,T);
        switch(k){
          case 'pos.x':node.position.x=v;break;case 'pos.y':node.position.y=v;break;case 'pos.z':node.position.z=v;break;
          case 'rot.x':node.rotation.x=v*D2R;break;case 'rot.y':node.rotation.y=v*D2R;break;case 'rot.z':node.rotation.z=v*D2R;break;
          case 'scale.x':node.scale.x=Math.max(v,0.0001);break;case 'scale.y':node.scale.y=Math.max(v,0.0001);break;case 'scale.z':node.scale.z=Math.max(v,0.0001);break;
          case 'visible':node.visible=!!v;break;
          case 'opacity':setOp(node,v);break;
          case 'emissive':em=v;break;
          case 'color':if(en._col!==v){en._col=v;setCol(node,v);}break;
        }
      }
    }
    var tgt=em+(en.hover?0.45:0);
    if(en._em!==tgt){en._em=tgt;setEm(node,tgt);}
  }
}
function updateFlows(){
  for(var e=0;e<entries.length;e++){
    var en=entries[e],fl=en.node&&en.node.userData.flow;if(!fl||!en.node.visible)continue;
    var sp=val(fl.speed),arr=en.node.geometry.attributes.position.array,i,k,d,u,s,A,B;
    for(i=0;i<fl.n;i++){
      u=((i/fl.n)+T*sp/fl.total)%1;if(u<0)u+=1;d=u*fl.total;k=1;
      while(k<fl.cum.length-1&&fl.cum[k]<d)k++;
      s=(d-fl.cum[k-1])/Math.max(1e-6,fl.cum[k]-fl.cum[k-1]);A=fl.path[k-1];B=fl.path[k];
      arr[i*3]=A[0]+(B[0]-A[0])*s;
      arr[i*3+1]=A[1]+(B[1]-A[1])*s+Math.sin(i*12.9898)*fl.jit;
      arr[i*3+2]=(A[2]||0)+((B[2]||0)-(A[2]||0))*s+Math.cos(i*7.233)*fl.jit;
    }
    en.node.geometry.attributes.position.needsUpdate=true;
  }
}
function updateLabels(){
  for(var e=0;e<entries.length;e++){
    var en=entries[e];if(!en.label)continue;
    var o=en.o,lp=o.lp||[0,0.55,0],base=o.la?o.la:(en.node?[en.node.position.x,en.node.position.y,en.node.position.z]:[0,0,0]);
    en.label.position.set(base[0]+lp[0],base[1]+lp[1],base[2]+lp[2]);
    en.label.visible=en.node?en.node.visible:true;
  }
}

/* ---------- interaction ---------- */
var pointers={},downX=0,downY=0,moved=false,pinchD=0,ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),hovered=null;
function pick(e){
  var r=dom.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);var hits=ray.intersectObjects(world.children,true);
  for(var i=0;i<hits.length;i++){var n=hits[i].object;while(n&&!(n.userData&&n.userData.entry))n=n.parent;if(n&&n.userData.entry&&(n.userData.entry.o.info||n.userData.entry.o.click||n.userData.entry.o.label))return n.userData.entry;}
  return null;
}
function setHover(en){
  if(en===hovered)return;
  if(hovered)hovered.hover=false;
  hovered=en;if(en)en.hover=true;
  showHint(en);dom.style.cursor=(en&&en.o.click)?'pointer':'';
}
dom.addEventListener('contextmenu',function(e){e.preventDefault();});
dom.addEventListener('pointerdown',function(e){
  try{dom.setPointerCapture(e.pointerId);}catch(x){}
  pointers[e.pointerId]={x:e.clientX,y:e.clientY};downX=e.clientX;downY=e.clientY;moved=false;dragging=true;stage.classList.add('drag');
  var ids=Object.keys(pointers);if(ids.length===2){var a=pointers[ids[0]],b=pointers[ids[1]];pinchD=Math.hypot(a.x-b.x,a.y-b.y);}
});
dom.addEventListener('pointermove',function(e){
  var pt=pointers[e.pointerId];
  if(!pt){setHover(pick(e));return;}
  var ids=Object.keys(pointers);
  if(ids.length===2){
    pt.x=e.clientX;pt.y=e.clientY;var a=pointers[ids[0]],b=pointers[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0){radius=clamp(radius*pinchD/Math.max(dd,1),2,90);}pinchD=dd;moved=true;return;
  }
  var dx=e.clientX-pt.x,dy=e.clientY-pt.y;pt.x=e.clientX;pt.y=e.clientY;
  if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>4)moved=true;
  if((e.buttons&2)||e.shiftKey||e.ctrlKey){
    var right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1),sc=radius*0.0016;
    target.addScaledVector(right,-dx*sc);target.addScaledVector(up,dy*sc);
  }else{theta-=dx*0.008;phi=clamp(phi-dy*0.008,0.12,Math.PI-0.12);}
});
function endPointer(e){
  var had=pointers[e.pointerId];delete pointers[e.pointerId];pinchD=0;
  if(Object.keys(pointers).length===0){dragging=false;stage.classList.remove('drag');}
  if(had&&!moved&&e.type==='pointerup'){
    var en=pick(e);
    if(en&&en.o.click){var upd={},k;for(k in en.o.click){upd[k]=val(en.o.click[k]);}for(k in upd){P[k]=upd[k];}changed(false);}
  }
}
dom.addEventListener('pointerup',endPointer);dom.addEventListener('pointercancel',endPointer);
dom.addEventListener('pointerleave',function(){if(!dragging)setHover(null);});
dom.addEventListener('wheel',function(e){e.preventDefault();radius=clamp(radius*(1+e.deltaY*0.0012),2,90);},{passive:false});
document.getElementById('bReset').onclick=function(){resetView();};
var bRot=document.getElementById('bRot');if(autoRot)bRot.classList.add('on');
bRot.onclick=function(){autoRot=!autoRot;bRot.classList.toggle('on',autoRot);};
var bLab=document.getElementById('bLab');
bLab.onclick=function(){labelGroup.visible=!labelGroup.visible;bLab.classList.toggle('on',labelGroup.visible);};

/* ---------- sizing + loop ---------- */
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;if(w<2||h<2)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);resize();
var last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  var dt=Math.min((now-last)/1000,0.1);last=now;
  if(document.hidden||stage.clientWidth<2||stage.clientHeight<2)return;
  T+=dt;
  if(autoRot&&!dragging)theta+=dt*0.35;
  updateCamera();applyBinds();updateFlows();updateLabels();
  renderer.render(scene,camera);
}
requestAnimationFrame(tick);
}
})();
</script></body></html>
